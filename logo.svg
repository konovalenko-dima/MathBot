<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
    <!-- Фон иконки -->
    <defs>
        <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#2c3e50"/>
            <stop offset="100%" style="stop-color:#34495e"/>
        </linearGradient>
    </defs>
    
    <!-- Иконка -->
    <rect x="10" y="20" width="40" height="40" rx="8" fill="url(#iconGradient)"/>
    <text x="30" y="45" font-family="Arial" font-size="24" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">M</text>
    
    <!-- Математические символы -->
    <text x="30" y="10" font-family="Arial" font-size="16" fill="#2c3e50" opacity="0.3" text-anchor="middle">∫</text>
    <text x="55" y="60" font-family="Arial" font-size="16" fill="#2c3e50" opacity="0.3" text-anchor="middle">π</text>
    <text x="5" y="60" font-family="Arial" font-size="16" fill="#2c3e50" opacity="0.3" text-anchor="middle">∞</text>
    
    <!-- Текст Math -->
    <text x="70" y="35" font-family="Segoe UI, Arial" font-size="24" font-weight="600" fill="#2c3e50">Math</text>
    
    <!-- Текст OldSchool -->
    <text x="70" y="55" font-family="Brush Script MT, cursive" font-size="14" fill="#8B0000" font-style="italic">OldSchool</text>
</svg> 